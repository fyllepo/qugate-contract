# Branch: main receives merged PRs only.
# Feature branches use feature/YYYY-MM-DD-Name convention per qubic/core contributing.md

name: CI

on:
  push:
    branches: [main, v2.5, 'feature/**']
  pull_request:

jobs:
  contract-guard:
    runs-on: ubuntu-latest
    name: Contract guard rails
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Run guard checks
        run: python3 scripts/contract_guard.py

  # ── Contract verification ──────────────────────────────────────────────
  contract-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Verify QuGate.h compliance
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Pull verifier image
        run: docker pull ghcr.io/franziska-mueller/qubic-contract-verify:latest
      - name: Inspect verifier image
        run: |
          docker image inspect ghcr.io/franziska-mueller/qubic-contract-verify:latest --format '
          Id: {{.Id}}
          Entrypoint: {{json .Config.Entrypoint}}
          Cmd: {{json .Config.Cmd}}
          WorkingDir: {{json .Config.WorkingDir}}
          Env: {{json .Config.Env}}
          '
      - name: Inspect entrypoint script
        run: docker run --rm --entrypoint /bin/sh ghcr.io/franziska-mueller/qubic-contract-verify:latest -lc 'ls -la && echo "--- entrypoint.sh ---" && cat /entrypoint.sh 2>/dev/null || echo "No /entrypoint.sh found"'
      - name: Contract verify
        run: |
          set -euo pipefail

          image="ghcr.io/franziska-mueller/qubic-contract-verify:latest"
          name="qugate-contract-verify"

          docker rm -f "$name" >/dev/null 2>&1 || true

          docker run -d \
            --name "$name" \
            --workdir /github/workspace \
            -v "$PWD:/github/workspace" \
            "$image" 'QuGate.h' >/tmp/qugate-contract-verify.cid

          cid="$(cat /tmp/qugate-contract-verify.cid)"
          echo "Started verifier container: $cid"
          echo "Streaming logs and container diagnostics every 15s until completion..."

          while true; do
            status="$(docker inspect --format '{{.State.Status}}' "$cid")"
            running="$(docker inspect --format '{{.State.Running}}' "$cid")"
            started="$(docker inspect --format '{{.State.StartedAt}}' "$cid")"
            finished="$(docker inspect --format '{{.State.FinishedAt}}' "$cid")"

            echo "---- verifier status ----"
            echo "status=$status running=$running started=$started finished=$finished"

            if [ "$running" = "true" ]; then
              docker stats --no-stream "$cid" || true
              docker top "$cid" || true

              host_pid="$(docker top "$cid" -eo pid,cmd | awk '/\/contract-verify\/build\/src\/contractverify/ {print $1; exit}' || true)"
              if [ -n "${host_pid:-}" ]; then
                echo "---- verifier host sample (pid=$host_pid) ----"
                if command -v gdb >/dev/null 2>&1; then
                  gdb -q -batch -ex 'thread apply all bt' -p "$host_pid" 2>&1 || true
                elif command -v strace >/dev/null 2>&1; then
                  timeout 5 strace -p "$host_pid" -f -s 120 2>&1 || true
                else
                  echo "Neither gdb nor strace is available on the runner."
                fi
              fi
            fi

            echo "---- verifier logs ----"
            docker logs "$cid" 2>&1 || true

            if [ "$running" != "true" ]; then
              break
            fi

            sleep 15
          done

          exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$cid")"
          echo "Verifier exited with code $exit_code"
          docker logs "$cid" 2>&1 || true
          docker rm -f "$cid" >/dev/null 2>&1 || true
          exit "$exit_code"

  # ── Style lint (best-effort) ───────────────────────────────────────────
  # Best-effort brace-style check.  May produce false positives on
  # multi-line macros or string literals — treat warnings accordingly.
  lint:
    runs-on: ubuntu-latest
    name: Style lint
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Check brace style
        run: |
          status=0

          if grep -rn --include='*.h' --include='*.cpp' -P '\)\s*\{' .; then
            echo "::warning::Found same-line opening braces (expected brace on next line)"
            status=1
          fi

          if grep -rn --include='*.h' --include='*.cpp' -P '\}\s*else' .; then
            echo "::warning::Found '} else' on same line (expected else on its own line)"
            status=1
          fi

          if [ "$status" -ne 0 ]; then
            echo "Style issues detected (see above)."
            exit 1
          fi
          echo "Brace style OK"

  # ── Integration tests (require running testnet node) ───────────────────
  # These tests need qubic-cli, identity_tool, and a node at 127.0.0.1:41841.
  # They are skipped in CI — run locally against the testnet on Neutron-01.
  test-integration:
    runs-on: ubuntu-latest
    name: Integration tests (testnet)
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install pytest requests
      - name: Run tests (skip if no node)
        run: |
          python3 -c "
          import sys, requests
          try:
              r = requests.get('http://127.0.0.1:41841/live/v1/tick-info', timeout=2)
              if r.status_code == 200:
                  sys.exit(0)
          except Exception:
              pass
          print('::notice::Testnet node not available — skipping integration tests')
          sys.exit(2)
          " && pytest tests/ --ignore=tests/test_testnet.py -v --tb=short || {
            code=$?
            if [ "$code" -eq 2 ]; then
              echo "Integration tests skipped (no node)"
              exit 0
            fi
            exit "$code"
          }
